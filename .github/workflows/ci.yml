name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder Supabase config so modules that create the client can load in tests/build.
      # Tests must not call the real backend.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Lint (informational for now)
        run: npm run lint
        continue-on-error: true
